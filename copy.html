<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copy</title>
<style>
  html,body{margin:0;padding:0;background:#0f1117;color:#e6e6e6;font:16px/1.4 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Inter,system-ui}
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{max-width:720px;width:92%;background:#131623;border:1px solid #23283d;border-radius:14px;padding:18px}
  .txt{white-space:pre-wrap;word-break:break-word;background:#0b0e19;border:1px solid #20263a;border-radius:10px;padding:14px}
  .btn{margin-top:14px;width:100%;padding:14px 16px;border:0;border-radius:10px;background:#3a5cfb;color:#fff;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div id="text" class="txt"></div>
    <button id="copy" class="btn">📋 Скопировать</button>
  </div>
</div>

<script>
  // Telegram WebApp API
  const tg = window.Telegram?.WebApp;
  const params = new URLSearchParams(location.search);
  const t = params.get('t') || '';
  const box = document.getElementById('text');
  const btn = document.getElementById('copy');
  box.textContent = t;

  async function doCopyAndClose(){
    try{
      await navigator.clipboard.writeText(t);
      if (tg){ tg.HapticFeedback?.impactOccurred('light'); tg.close(); }
      else { alert('Скопировано'); window.close(); }
    }catch(e){
      alert('Не удалось скопировать: '+e);
    }
  }
  btn.addEventListener('click', doCopyAndClose);

  // авто-фокус на кнопку (для удобства)
  setTimeout(()=>btn.focus(), 50);
</script>
</body>
</html>
