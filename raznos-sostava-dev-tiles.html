<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Разнос состава — dev tiles</title><style>html,body{margin:0;height:100%;background:#09070c;color:#fff;font-family:Inter,Arial,sans-serif}.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;text-align:center;background:radial-gradient(circle at top,#231630 0%,#0c0a12 55%,#060509 100%)}.spinner{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.16);border-top-color:#ff56d0;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.small{opacity:.82;font-size:14px;max-width:360px;line-height:1.4}</style></head><body><div class="loading"><div class="spinner"></div><div><b>Открываю dev-сборку с фишками…</b></div><div class="small">Подмешиваю портретные фишки поверх рабочей версии.</div></div><script>async function boot(){try{const res=await fetch('./raznos-sostava-v2.html',{cache:'no-store'});let html=await res.text();html=html.replace('class="overlay show" id="startOverlay"','class="overlay active" id="startOverlay"');html=html.replace('.overlay.active { display: flex; }','.overlay.active, .overlay.show { display: flex; }');if(!html.includes('.mini-list {')){html=html.replace('.toast.show {\n      opacity: 1;\n      transform: translateX(-50%) translateY(0);\n    }','.toast.show {\n      opacity: 1;\n      transform: translateX(-50%) translateY(0);\n    }\n\n    .mini-list {\n      margin-top: 14px;\n      display: grid;\n      gap: 8px;\n    }\n\n    .level-grid {\n      margin-top: 16px;\n      display: grid;\n      grid-template-columns: repeat(3, minmax(0,1fr));\n      gap: 10px;\n    }\n\n    @media (max-width: 420px) {\n      .level-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }\n    }')}const overlayFix='<script>(function(){function hide(){var ov=document.getElementById("startOverlay");if(!ov)return;ov.classList.remove("show","active");ov.style.display="none";ov.style.pointerEvents="none";}function boardReady(){return !!document.querySelector("#board .cell");}var tries=0;var timer=setInterval(function(){tries++;if(boardReady()){hide();clearInterval(timer);}if(tries>80)clearInterval(timer);},100);document.addEventListener("click",function(e){var t=e.target;if(t&&(t.id==="startGameBtn"||(t.closest&&t.closest("#startGameBtn")))){setTimeout(hide,0);setTimeout(hide,120);setTimeout(hide,400);setTimeout(hide,900);}},true);setTimeout(function(){if(boardReady())hide();},500);setTimeout(function(){if(boardReady())hide();},1500);})();<\/script>';const hudFix='<script src="./raznos-hud-art.js"><\/script>';const tileFix='<script src="./raznos-tile-art-stable.js"><\/script>';const tbankFix='<script src="./raznos-tbank-icons.js"><\/script>';html=html.replace('</body>',overlayFix+hudFix+tileFix+tbankFix+'</body>');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div style="padding:24px;font-family:Arial,sans-serif;color:#fff;background:#09070c;min-height:100vh"><h2>Не удалось открыть сборку</h2><p>Обнови страницу и попробуй ещё раз.</p></div>';console.error(e)}}boot();</script></body></html>
